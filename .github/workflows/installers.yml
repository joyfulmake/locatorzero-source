name: Test and build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # Builds run only in the public source repo (joyfulmake/locatorzero-source), where CI minutes are free and anyone
    # can match an installer to the source it came from. In the private repo this workflow is skipped.
    if: github.repository == 'joyfulmake/locatorzero-source'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Web app, 23 browser checks
        run: npm test
        env: { CHROMIUM: /usr/bin/google-chrome }
      - name: Desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf plocate
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - name: Desktop core tests
        working-directory: desktop/src-tauri
        run: node ../build-frontend.mjs && cargo test --release
      - name: No networking library compiled in
        run: desktop/check-no-network.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,rpm,appimage' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'msi,nsis' }
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: 'dmg' }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: 'dmg' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri, key: '${{ matrix.target }}' }
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Strip build-machine paths from the program, so installers carry no user or machine names.
      - name: Remove build paths from binaries (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=$HOME=/home --remap-path-prefix=$GITHUB_WORKSPACE=/src" >> "$GITHUB_ENV"
          echo "CFLAGS=-ffile-prefix-map=$HOME=/home" >> "$GITHUB_ENV"
      - name: Remove build paths from binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=--remap-path-prefix=$env:USERPROFILE=C:\home --remap-path-prefix=$env:GITHUB_WORKSPACE=C:\src" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'
      - name: Build
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Microsoft Store package (.msix)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./desktop/msix/build-msix.ps1 -Target ${{ matrix.target }}
      - name: Check the .msix installs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: ./desktop/msix/test-msix.ps1 -Target ${{ matrix.target }}
      - name: Check the program holds no build-machine paths
        shell: bash
        run: |
          exe=desktop/src-tauri/target/${{ matrix.target }}/release/locatorzero
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          if grep -aoiE 'runneradmin|/home/runner/|/Users/runner/|[A-Z]:\\a\\' "$exe" | sort | uniq -c | head; then
            echo "::error::build-machine paths found in the program"; exit 1
          fi
          echo "clean"
      - uses: actions/upload-artifact@v4
        with:
          name: LocatorZero-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msix/*.msix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
