# End-to-end tests of the web app (the same interface the desktop app ships), in a real browser.
name: web-tests
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Test a deployment instead of the files in this commit (e.g. https://locatorzero.pages.dev/)
        required: false
jobs:
  e2e:
    if: github.repository == 'joyfulmake/locatorzero-source'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: End-to-end tests
        env:
          CHROMIUM: /usr/bin/google-chrome
          BASE_URL: ${{ inputs.base_url }}
        run: node tests/e2e.mjs
      - run: node tests/licence-key-service.mjs
